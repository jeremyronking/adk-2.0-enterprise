steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '--build-arg', 'SERVICE=${_SERVICE}', '-t', '${_IMAGE}', '.']
images:
- '${_IMAGE}'
substitutions:
  # Both are supplied by the Makefile deploy targets; these are fallbacks only.
  # _IMAGE is fully qualified there as gcr.io/$(PROJECT_ID)/<service>:latest.
  _SERVICE: 'router'
  _IMAGE: 'gcr.io/$PROJECT_ID/adk-enterprise-router:latest'
