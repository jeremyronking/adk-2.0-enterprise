<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Agent composition</title>
  <desc id="wf-desc">A browser calls the router, which serves the UI and proxies the ADK REST API. The root chat_agent transfers to construction_agent, which invokes five trade agents and an inspector agent as tool calls. The inspector returns PASS to advance, or FIX to send the phase back for repair.</desc>

  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4d63"/>
    </marker>
    <marker id="wf-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="24" fill="#0a0b14"/>
  <rect x="0.75" y="0.75" width="1198.5" height="478.5" rx="23.25"
        fill="none" stroke="#28293d" stroke-width="1.5"/>

  <!-- ── Request path ────────────────────────────────────────────── -->
  <g id="request-path">
    <rect x="64" y="76" width="150" height="66" rx="12"
          fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <text x="139" y="116" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#a8adc2">Browser</text>

    <path d="M222 109 H 280" stroke="#4a4d63" stroke-width="2"
          fill="none" marker-end="url(#wf-arrow)"/>
    <text x="251" y="96" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7c8199">SSE</text>

    <rect x="288" y="76" width="210" height="66" rx="12"
          fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <text x="393" y="106" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21" fill="#e6e8f0">router</text>
    <text x="393" y="130" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7c8199">ui · proxy · quota</text>

    <path d="M506 109 H 556" stroke="#4a4d63" stroke-width="2"
          fill="none" marker-end="url(#wf-arrow)"/>

    <rect x="564" y="76" width="196" height="66" rx="12"
          fill="#12131c" stroke="#00f0ff" stroke-width="2"/>
    <text x="662" y="116" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21" fill="#00f0ff">chat_agent</text>

    <path d="M768 109 H 862" stroke="#4a4d63" stroke-width="2"
          fill="none" marker-end="url(#wf-arrow)"/>
    <text x="811" y="96" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7c8199">transfer</text>

    <rect x="870" y="76" width="266" height="66" rx="12"
          fill="#12131c" stroke="#00f0ff" stroke-width="2"/>
    <text x="1003" y="116" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21" fill="#00f0ff">construction_agent</text>
  </g>

  <!-- ── Trade agents, invoked as tools ──────────────────────────── -->
  <g id="trade-agents">
    <path d="M1003 142 V 178" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M160 178 H 1003" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <text x="530" y="166"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#00f0ff">agenttool calls</text>

    <path d="M160 178 V 208" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#wf-arrow-cyan)"/>
    <path d="M380 178 V 208" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#wf-arrow-cyan)"/>
    <path d="M600 178 V 208" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#wf-arrow-cyan)"/>
    <path d="M820 178 V 208" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#wf-arrow-cyan)"/>
    <path d="M1040 178 V 208" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#wf-arrow-cyan)"/>

    <rect x="64"  y="216" width="192" height="60" rx="12" fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <rect x="284" y="216" width="192" height="60" rx="12" fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <rect x="504" y="216" width="192" height="60" rx="12" fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <rect x="724" y="216" width="192" height="60" rx="12" fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <rect x="944" y="216" width="192" height="60" rx="12" fill="#12131c" stroke="#28293d" stroke-width="1.5"/>

    <text x="160"  y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8adc2">foundation</text>
    <text x="380"  y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8adc2">framing</text>
    <text x="600"  y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8adc2">roofing</text>
    <text x="820"  y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8adc2">exterior</text>
    <text x="1040" y="253" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#a8adc2">interior</text>
  </g>

  <!-- ── Inspector gate ──────────────────────────────────────────── -->
  <g id="inspector">
    <path d="M160 276 V 306"  stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M380 276 V 306"  stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M600 276 V 306"  stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M820 276 V 306"  stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M1040 276 V 306" stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M160 306 H 1040" stroke="#4a4d63" stroke-width="2" fill="none"/>
    <path d="M600 306 V 344"  stroke="#ffba20" stroke-width="2" fill="none"/>

    <rect x="440" y="344" width="320" height="66" rx="12"
          fill="#12131c" stroke="#ffba20" stroke-width="2"/>
    <text x="600" y="385" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21" fill="#ffba20">inspector_agent</text>

    <text x="252" y="443" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#00fa64">PASS</text>
    <text x="266" y="443"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#7c8199">advance to the next phase</text>

    <text x="746" y="443" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#ffba20">FIX</text>
    <text x="760" y="443"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#7c8199">repair, then re-inspect</text>
  </g>
</svg>
