<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Enterprise Agent Platform</title>
  <desc id="hero-desc">A crew of LLM agents builds a structure in five phases while an inspector agent audits each one. Failed inspections loop back to the trade agent as a repair, then re-inspect until the phase passes.</desc>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffba20"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00fa64"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0a0b14"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25"
        fill="none" stroke="#28293d" stroke-width="1.5"/>

  <!-- ── Title block ─────────────────────────────────────────────── -->
  <g id="title-block">
    <text x="64" y="96"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2.4" fill="#00f0ff">GO · GOOGLE ADK 2.0 · MULTI-AGENT ORCHESTRATION</text>

    <text x="64" y="164"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="54" font-weight="700" fill="#e6e8f0">Enterprise Agent Platform</text>

    <text x="64" y="212"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="23" fill="#a8adc2">A crew of LLM agents builds a structure in five phases.</text>
    <text x="64" y="246"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="23" fill="#a8adc2">An inspector rejects bad work and forces repairs.</text>

    <!-- metadata rule -->
    <path d="M64 282 H 596" stroke="#28293d" stroke-width="1.5"/>
    <text x="64" y="312"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7c8199">go 1.26 · adk/v2 · live demo at adk.jking.ai</text>
  </g>

  <!-- ── The inspection gate: this project's defining mechanism ──── -->
  <g id="inspection-gate">
    <text x="886" y="52" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.6" fill="#7c8199">THE INSPECTION GATE</text>

    <!-- trade agent -->
    <rect x="766" y="72" width="240" height="58" rx="12"
          fill="#12131c" stroke="#00f0ff" stroke-width="2"/>
    <text x="886" y="108" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#00f0ff">framing_agent</text>

    <!-- build -->
    <path d="M886 130 V 162" stroke="#00f0ff" stroke-width="2"
          marker-end="url(#arrow-cyan)" fill="none"/>

    <!-- inspector -->
    <rect x="766" y="170" width="240" height="60" rx="12"
          fill="#12131c" stroke="#ffba20" stroke-width="2"/>
    <text x="886" y="208" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#ffba20">inspector_agent</text>

    <!-- FIX: loops back up into the trade agent -->
    <path d="M826 230 V 264 H 722 V 101 H 758"
          stroke="#ffba20" stroke-width="2" fill="none"
          marker-end="url(#arrow-amber)"/>
    <!-- label sits on the return line, so it reads with the loop -->
    <rect x="700" y="203" width="44" height="30" fill="#0a0b14"/>
    <text x="722" y="225" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" font-weight="700" fill="#ffba20">FIX</text>

    <!-- PASS: proceeds to the next phase -->
    <path d="M946 230 V 264 H 1004"
          stroke="#00fa64" stroke-width="2" fill="none"
          marker-end="url(#arrow-emerald)"/>
    <text x="946" y="252"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" font-weight="700" fill="#00fa64">PASS</text>
    <rect x="1012" y="242" width="132" height="44" rx="10"
          fill="#12131c" stroke="#28293d" stroke-width="1.5"/>
    <text x="1078" y="270" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#a8adc2">next phase</text>

    <text x="886" y="322" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7c8199">× 5 phases · foundation → interior</text>
  </g>
</svg>
